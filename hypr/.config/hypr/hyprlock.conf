source = $HOME/.config/hypr/colors/tokyo_night.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font

# GENERAL
general {
  hide_cursor = true
}

# BACKGROUND
background {
  monitor =
  path = $HOME/.config/hypr/wallpapers/japan_skyline.png
  blur_passes = 2
  color = $base
}

# LAYOUT
label {
  monitor = eDP-1
  text = Layout: $LAYOUT
  color = $text
  font_size = 25
  font_family = $font
  position = 30, 30
  halign = left
  valign = bottom
}

# TIME
label {
  monitor = eDP-1
  text = $TIME
  color = $text
  font_size = 90
  font_family = $font
  position = 0, 550
  halign = center
  valign = center
}

# DATE
label {
  monitor = eDP-1
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 25
  font_family = $font
  position = 0, 450
  halign = center
  valign = center
}

# INPUT FIELD
input-field {
  monitor = eDP-1
  size = 350, 80
  outline_thickness = 3
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  # placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
  placeholder_text = 
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -100
  halign = center
  valign = center
}



