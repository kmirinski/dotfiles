general {
    # quickshell's lock screen, falling back to hyprlock if the shell is dead
    # or its ipc is unreachable. the pidof guard avoids stacking hyprlocks.
    lock_cmd = qs ipc call lock lock || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' # to avoid having to press a key twice to run on the display
}

listener {
    timeout = 480 
    on-timeout = brightnessctl -s set 10; brightnessctl -sd asus::kbd_backlight set 0
    on-resume = brightnessctl -r; brightnessctl -rd asus::kbd_backlight
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'   # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'    # screen on when activity is detected after timeout has fired (brightness already restored by the 300s listener)
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
